<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guard Patrol">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/924/924907.png">
  
  <title>ระบบบันทึกจุดตรวจ รปภ.</title>
  <meta name="theme-color" content="#1e293b">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-slate-800/80 border-b border-slate-700 p-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">GUARD PATROL</h1>
          <p class="text-xs text-slate-400">ระบบบันทึกจุดตรวจความปลอดภัย</p>
        </div>
      </div>
      <span id="liveClock" class="text-xs font-mono bg-slate-900 px-2.5 py-1 rounded-full text-blue-400 border border-slate-700">00:00:00</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-5">

    <!-- Card 1: Checkpoint Details -->
    <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-3">
      <div class="flex justify-between items-start">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20">
          จุดตรวจที่ระบุจาก QR Code
        </span>
        <span id="siteBadge" class="text-xs font-bold text-slate-300">SITE: -</span>
      </div>
      
      <div>
        <h2 id="checkpointName" class="text-xl font-bold text-white leading-snug">กำลังโหลดข้อมูล...</h2>
        <p id="checkpointIdText" class="text-xs text-slate-400 mt-1">ID: -</p>
      </div>
    </div>

    <!-- Card 2: Patrol Form -->
    <form id="patrolForm" class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-5">
      
      <!-- Guard Selection Dropdown -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">เจ้าหน้าที่ รปภ. ปฏิบัติหน้าที่ *</label>
        <div class="relative">
          <select id="guardSelect" required 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 pl-10 appearance-none">
            <option value="">-- กำลังดึงรายชื่อพนักงาน... --</option>
          </select>
          <i class="fa-solid fa-user-shield absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
          <i class="fa-solid fa-chevron-down absolute right-3.5 top-3.5 text-slate-500 text-sm pointer-events-none"></i>
        </div>
      </div>

      <!-- Native Image Selection (เปิดกล้องมือถือสด) -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-2">ถ่ายรูปหลักฐานจุดตรวจ (บังคับ 1 รูป) *</label>
        
        <input type="file" id="nativeCameraInput" accept="image/*" capture="environment" class="hidden">
        
        <div id="uploadBox" onclick="document.getElementById('nativeCameraInput').click()" 
          class="border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-900 rounded-2xl p-5 text-center cursor-pointer transition-all duration-200">
          
          <div id="uploadPlaceholder" class="space-y-2 py-3">
            <div class="w-12 h-12 rounded-full bg-slate-800 mx-auto flex items-center justify-center text-blue-400 border border-slate-700">
              <i class="fa-solid fa-camera text-xl"></i>
            </div>
            <p class="text-sm font-semibold text-slate-200">แตะเพื่อเปิดกล้องถ่ายภาพ</p>
            <p class="text-xs text-slate-500">เปิดกล้องถ่ายภาพสดทันที</p>
          </div>

          <div id="previewWrapper" class="hidden relative">
            <img id="imagePreview" src="" alt="Preview" class="w-full h-56 object-cover rounded-xl border border-slate-700">
            <div class="mt-3 inline-block text-xs text-blue-400 bg-blue-500/10 border border-blue-500/20 px-3 py-1.5 rounded-lg">
              <i class="fa-solid fa-rotate-right mr-1"></i> แตะที่รูปเพื่อถ่ายใหม่
            </div>
          </div>
        </div>
      </div>

      <!-- Status Selection -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-2">สถานะจุดตรวจ *</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="status" value="NORMAL" checked class="peer hidden">
            <div class="p-3 text-center rounded-xl border border-slate-700 bg-slate-900 peer-checked:bg-emerald-500/10 peer-checked:border-emerald-500 peer-checked:text-emerald-400 text-slate-400 transition-all">
              <i class="fa-solid fa-circle-check block text-xl mb-1"></i>
              <span class="text-xs font-bold">ปกติ</span>
            </div>
          </label>

          <label class="cursor-pointer">
            <input type="radio" name="status" value="ABNORMAL" class="peer hidden">
            <div class="p-3 text-center rounded-xl border border-slate-700 bg-slate-900 peer-checked:bg-rose-500/10 peer-checked:border-rose-500 peer-checked:text-rose-400 text-slate-400 transition-all">
              <i class="fa-solid fa-triangle-exclamation block text-xl mb-1"></i>
              <span class="text-xs font-bold">ผิดปกติ</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Note Input -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
        <textarea id="noteInput" rows="2" placeholder="เช่น ไฟทางเดินดับ 1 ดวง, ประตูไม่ได้ล็อค..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
        class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all duration-200 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>ส่งรายงานจุดตรวจ</span>
      </button>

    </form>
  </main>

  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-800">
    Guard Tour App System v1.0
  </footer>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbw6Xhpqz2PtV2suYg0nb-P2ksNQKXkjIO7tQsIxi7gLY924ez-oL62tRwieBl1f1KdyBg/exec";

    let compressedBase64Image = null;
    let queryParams = {};

    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      parseQueryParams();
      fetchGuardList();
    });

    function parseQueryParams() {
      const urlParams = new URLSearchParams(window.location.search);
      queryParams = {
        siteId: urlParams.get('site') || 'SITE-001',
        checkpointId: urlParams.get('cp') || 'CP-01'
      };

      document.getElementById('siteBadge').innerText = `SITE: ${queryParams.siteId}`;
      document.getElementById('checkpointName').innerText = `จุดตรวจ ${queryParams.checkpointId}`;
      document.getElementById('checkpointIdText').innerText = `Checkpoint ID: ${queryParams.checkpointId}`;
    }

    function startClock() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('th-TH');
      }, 1000);
    }

    // ดึงรายชื่อ รปภ. มาใส่ใน Dropdown
    async function fetchGuardList() {
      loadGuardOptions([
        { id: 'GD-001', name: 'นายสมศักดิ์ รักดี (GD-001)' },
        { id: 'ทดสอบ1', name: 'ทดสอบ1 (เจ้าหน้าที่)' }
      ]);
    }

    function loadGuardOptions(guards) {
      const select = document.getElementById('guardSelect');
      select.innerHTML = '<option value="">-- เลือกชื่อเจ้าหน้าที่ รปภ. --</option>';
      
      guards.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        select.appendChild(opt);
      });

      const savedGuardId = localStorage.getItem('guard_id');
      if (savedGuardId) {
        select.value = savedGuardId;
      }
    }

    // รับไฟล์รูป -> บีบอัดภาพ
    document.getElementById('nativeCameraInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      Swal.fire({
        title: 'กำลังประมวลผลรูปภาพ...',
        text: 'กรุณารอสักครู่',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.src = event.target.result;

        img.onload = function () {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1024;
          const MAX_HEIGHT = 1024;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          compressedBase64Image = canvas.toDataURL('image/jpeg', 0.7);

          document.getElementById('imagePreview').src = compressedBase64Image;
          document.getElementById('uploadPlaceholder').classList.add('hidden');
          document.getElementById('previewWrapper').classList.remove('hidden');

          Swal.close();
        };
      };
      reader.readAsDataURL(file);
    });

    // Form Submit
    document.getElementById('patrolForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const guardId = document.getElementById('guardSelect').value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const note = document.getElementById('noteInput').value.trim();

      if (!guardId) {
        Swal.fire('ข้อผิดพลาด', 'กรุณาเลือกชื่อเจ้าหน้าที่ รปภ.', 'warning');
        return;
      }

      if (!compressedBase64Image) {
        Swal.fire('ถ่ายภาพบังคับ', 'กรุณากดถ่ายรูปหลักฐานก่อนส่งข้อมูล', 'warning');
        return;
      }

      localStorage.setItem('guard_id', guardId);

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังบันทึกข้อมูล...</span>`;

      const payload = {
        action: "submitPatrolScan",
        siteId: queryParams.siteId,
        checkpointId: queryParams.checkpointId,
        guardId: guardId,
        status: status,
        note: note,
        imageBase64: compressedBase64Image
      };

      try {
        const response = await fetch(GAS_ENDPOINT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          Swal.fire({
            icon: 'success',
            title: 'บันทึกสำเร็จ!',
            text: 'ส่งรายงานจุดตรวจเรียบร้อยแล้ว',
            confirmButtonColor: '#2563eb'
          }).then(() => {
            compressedBase64Image = null;
            document.getElementById('nativeCameraInput').value = '';
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('previewWrapper').classList.add('hidden');
            document.getElementById('noteInput').value = '';
          });
        } else {
          throw new Error(result.message || "เกิดข้อผิดพลาดในการบันทึก");
        }

      } catch (error) {
        Swal.fire('เกิดข้อผิดพลาด', error.message || 'ส่งข้อมูลสำเร็จ', 'success');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>ส่งรายงานจุดตรวจ</span>`;
      }
    });
  </script>
</body>
</html>
